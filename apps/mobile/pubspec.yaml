name: mobile
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^18.0.1

  # Наше системное решение для локализации (Перенесли сюда)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Сетевой слой и сгенерированный клиент (ONW-42).
  # Руками здесь ничего не пишется: модели и методы берутся из OpenAPI.
  dio: ^5.7.0
  retrofit: ^4.10.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  go_router_builder: ^4.5.0

  # Кодоген клиента (ONW-42)
  swagger_parser: ^1.44.3
  # 10.x, а не 9.x: девятая тянет source_gen <3, а go_router_builder требует
  # >=3.1 — версии не сходятся. Десятая работает на source_gen ^4.
  retrofit_generator: ^10.2.11
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_prod.png"
  flavors:
    dev:
      image_path: "assets/images/icon_dev.png"
    stage:
      image_path: "assets/images/icon_stage.png"
    prod:
      image_path: "assets/images/icon_prod.png"
