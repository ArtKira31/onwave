name: API

on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['apps/api/**', 'packages/**', '.github/workflows/api.yml']

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: onwave
          POSTGRES_PASSWORD: onwave
          POSTGRES_DB: onwave_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onwave" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://onwave:onwave@localhost:5432/onwave_test?schema=public
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: onwave-media
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-secret
      JWT_ACCESS_SECRET: ci-access-secret-value
      JWT_REFRESH_SECRET: ci-refresh-secret-value

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:lint
      - run: pnpm lint
      - run: pnpm --filter @onwave/api prisma:generate
      - run: pnpm --filter @onwave/api prisma:deploy
      - run: pnpm api:test
      - run: pnpm api:e2e
      - run: pnpm api:build
