name: Mobile

# Включается вместе с ONW-41: пока apps/mobile пуст, workflow ничего не делает.
on:
  push:
    # develop — общая ветка команды: пуш в неё обязан проверяться.
    # Без этого работа попадает в общий код, ни разу не собранная в CI.
    branches: [main, develop]
    paths: ['apps/mobile/**', 'packages/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', 'packages/**', '.github/workflows/mobile.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Есть ли Flutter-проект
        id: probe
        run: |
          if [ -f apps/mobile/pubspec.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "apps/mobile пуст — каркас поднимается в ONW-41"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.probe.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - if: steps.probe.outputs.ready == 'true'
        working-directory: apps/mobile
        run: flutter pub get

      # ONW-42: контракт — источник правды. Если схему поменяли, а клиент не
      # перегенерировали, сборка должна падать: иначе мобилка тихо разъедется
      # с бэкендом и выяснится это на устройстве.
      #
      # Шаг включается, когда в репозитории появится сгенерированный клиент.
      - name: Клиент не отстал от контракта
        if: steps.probe.outputs.ready == 'true'
        working-directory: apps/mobile
        run: |
          if [ ! -d lib/api ]; then
            echo "lib/api ещё нет — клиент генерируется в ONW-42, проверка пропущена"
            exit 0
          fi
          dart run swagger_parser
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --exit-code -- lib/api; then
            echo "::error::Сгенерированный клиент отстал от openapi.yaml. Перегенерируйте и закоммитьте."
            exit 1
          fi

      - if: steps.probe.outputs.ready == 'true'
        working-directory: apps/mobile
        run: |
          flutter analyze
          flutter test
          flutter build apk --debug --flavor dev

      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.ready == 'true'
        with:
          name: onwave-dev-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
